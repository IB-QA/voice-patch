site_name: VoiceMode
site_url: https://voicemode.dev
site_description: Natural voice conversations for AI assistants
site_author: Voice Mode Team

repo_name: IB-QA/voicemode
repo_url: https://github.com/IB-QA/voice-patch
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/voicemode-logo.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  # social-cards plugin removed (VM-1667): it required mkdocs-material[imaging]
  # (pillow + cairosvg, source of 7 Dependabot alerts). OG cards only matter
  # for a deployed site; this mkdocs config is a local-only preview.
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true

nav:
  - Home: README.md
  - Getting Started:
    - Installation: tutorials/getting-started.md
    - Configuration: guides/configuration.md
  - Guides:
    - Selecting Voices: guides/selecting-voices.md
    - macOS Media Keys: guides/macos-media-keys.md
    - MacBook Portable Mode: guides/macbook-portable.md
    - Selective Tool Loading: guides/selective-tool-loading.md
    - Remote Access (serve): guides/serve-configuration.md
  - Local Services:
    - Whisper STT: guides/whisper-setup.md
    - Kokoro TTS: guides/kokoro-setup.md
    - Windows Local Services: guides/windows-local-services.md
    - LiveKit Browser Rooms: guides/livekit-setup.md
  - Reference:
    - CLI Commands: reference/cli.md
    - Service Commands: reference/cli/service-commands.md
    - Control Channel: reference/control-channel.md
    - Converse Parameters: reference/converse-parameters.md
    - Environment Variables: reference/environment.md
    - Voices Resource: reference/voices-resource.md
  - Development:
    - Local Development: tutorials/development-setup.md
    - Tool Loading Architecture: reference/tool-loading-architecture.md
    - 'ADR 0001: Windows Local Services': architecture/adr/0001-windows-local-services.md
    - 'ADR 0002: Run MCP from Local Build': architecture/adr/0002-run-mcp-from-local-build.md
    - 'ADR 0003: Windows Console and Portability': architecture/adr/0003-windows-console-and-portability.md
    - 'ADR 0004: Installer Scope Selection': architecture/adr/0004-installer-multi-platform-scope.md
    - 'ADR 0005: Unified Service Install and GPU': architecture/adr/0005-unified-service-install-cli-and-gpu-variants.md
    - 'ADR 0006: Terminal and Log Portability': architecture/adr/0006-cross-platform-terminal-and-log-portability.md
    - ADR Index: architecture/adr/README.md
    - Windows Workflows: architecture/windows-workflows.md
    - PR Review Rubric: maintainers/pr-review-rubric.md
  - Troubleshooting:
    - Overview: troubleshooting/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/IB-QA/voice-patch
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/getvoicemode
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@getvoicemode

